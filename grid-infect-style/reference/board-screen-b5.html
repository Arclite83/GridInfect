<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Infect, board backgrounds</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#1b1d22;color:#ddd;font:14px/1.5 system-ui,sans-serif;padding:28px 20px}
h1{font:500 18px system-ui;margin:0 0 4px;color:#eee}
p.sub{margin:0 0 18px;color:#9aa;max-width:900px;font-size:13px}
.row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.col{width:390px}
.col h3{font:500 14px system-ui;margin:0 0 4px;color:#eee}
.col .n{font-size:12px;color:#99a;margin:0 0 10px;min-height:54px}
.screen{width:390px;height:844px;position:relative;overflow:hidden;border-radius:30px;box-shadow:0 30px 70px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,255,255,.06);font-family:'Chakra Petch',sans-serif}
.screen>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 12px;color:#1d3316}
.hud .lvl{font-size:26px;letter-spacing:.06em;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.hud .lvl small{display:block;font-size:11px;letter-spacing:.2em;opacity:.7;font-family:'Share Tech Mono',monospace;text-align:center}
.chip{font-size:12px;letter-spacing:.1em;padding:8px 14px;border-radius:7px;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.25);color:#1d3316;position:relative}
.chip:before,.chip:after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:#f3e2a8;box-shadow:0 0 4px rgba(243,226,168,.9);transform:translateY(-50%)}
.chip:before{left:-9px}.chip:after{right:-9px}
.badge{position:absolute;right:22px;top:104px;font-family:'Share Tech Mono',monospace;font-size:13px;padding:6px 12px;border-radius:7px;background:rgba(0,0,0,.35);color:#f3e2a8;box-shadow:inset 0 0 0 1px rgba(243,226,168,.35);letter-spacing:.12em}
.board{position:absolute;left:50%;top:138px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,54px);grid-auto-rows:54px;gap:5px;padding:14px;border-radius:12px;background:rgba(0,0,0,.36);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 60px rgba(0,0,0,.5),0 0 0 3px rgba(0,0,0,.18)}
.c{position:relative;border-radius:6px}
.c svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;z-index:1}
.c.out{background:rgba(0,0,0,.05);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.c.pad{background:radial-gradient(circle,#f3e2a8 0 4.5px,#c9a648 5.5px,transparent 6.5px)}
.c.chip2,.c.half{background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 55%,rgba(255,255,255,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.25),0 7px 16px rgba(0,0,0,.38)}
.c.chip2 .dot{position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:#f3e2a8;box-shadow:0 0 7px rgba(243,226,168,.9)}
.c.inf{background:linear-gradient(160deg,rgba(255,200,230,.9),#ff2d95 55%,#b3086a);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.4),0 0 26px #ff2d95,0 0 64px rgba(255,45,149,.55),0 7px 16px rgba(0,0,0,.38)}
.c.half{overflow:hidden}
.c.half:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,#ff2d95 0 16px,rgba(255,45,149,.55) 26px,transparent 38px)}
.c.trace{background:radial-gradient(circle,rgba(255,45,149,.5),transparent 70%);box-shadow:inset 0 0 0 1px rgba(255,45,149,.5)}
.c.shield{background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.2));box-shadow:inset 0 1px 0 #fff,inset 0 0 0 2px rgba(255,255,255,.75),0 7px 16px rgba(0,0,0,.38)}
.tray{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:center;justify-content:center;gap:30px}
.tray .slot{width:74px;height:74px;border-radius:12px;position:relative;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 24px rgba(0,0,0,.5)}
.tray .slot svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px}
.tray .slot.q{width:54px;height:54px;opacity:.75}
.tray .slot.q svg{width:40px;height:40px}
.tray .slot.next{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 24px rgba(0,0,0,.5),0 0 22px rgba(255,45,149,.45)}
.tray .lbl{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.2em;color:#1d3316;opacity:.75;white-space:nowrap}
</style>
</head>
<body>
<h1>Board background B5</h1>
<p class="sub">Same screen, same board state, D2 diagonal at row 2, A3 area at row 10, M4 blocker as the defense tile. Only the substrate changes. The gold routed traces are gone from all four; each tries a different answer to what fills the mask.</p>
<div class="row" id="row"></div>

<script>
const ANG={N:0,E:90,S:180,W:270,NE:45,SE:135,SW:225,NW:315};
const ORTH=["N","E","S","W"];
const F="#ff2d95",E="#5a0033",W="#3a0b22";
const rot=a=>`transform="rotate(${a} 20 20)"`;
const lead=a=>`<g ${rot(a)}><rect x="17" y="2" width="6" height="12" rx="1" fill="${E}"/><rect x="18" y="2" width="4" height="5" fill="#fff"/></g>`;
const bond=a=>`<g ${rot(a)} fill="none" stroke="${W}" stroke-width="1"><path d="M14.5 14 L14.5 7 Q14.5 4.5 17 4.5"/><path d="M25.5 14 L25.5 7 Q25.5 4.5 23 4.5"/></g>`;
const stubs=a=>`<g ${rot(a)} stroke="${W}" stroke-width="1" fill="${W}"><line x1="25.5" y1="7.5" x2="28.5" y2="7.5"/><circle cx="29.1" cy="7.5" r="1.1"/><line x1="14.5" y1="7.5" x2="11.5" y2="7.5"/><circle cx="10.9" cy="7.5" r="1.1"/></g>`;
const pin=(a,t,len,pad)=>`<g transform="rotate(${a} 20 20) translate(${t} 0)" stroke="${W}" stroke-width="1.1" fill="${W}"><line x1="20" y1="10.5" x2="20" y2="${10.5-len}"/>${pad?`<circle cx="20" cy="${10.5-len-0.6}" r="1.1"/>`:""}</g>`;
const core=(fill=F,edge=E)=>`<polygon points="20,9 30,14.5 30,25.5 20,31 10,25.5 10,14.5" fill="${fill}" stroke="${edge}" stroke-width="1.6" stroke-linejoin="round"/><polygon points="20,11 28,15.5 20,20 12,15.5" fill="rgba(255,255,255,.4)"/><circle cx="20" cy="20" r="3" fill="#fff"/>`;
const VERTS=[{a:45,s:["N","E"]},{a:135,s:["E","S"]},{a:225,s:["S","W"]},{a:315,s:["W","N"]}];
function body(active){let o="";for(const d of ORTH){if(active.has(d))continue;o+=pin(ANG[d],-4,3.5,true)+pin(ANG[d],0,2.5,false)+pin(ANG[d],4,3.5,true);}for(const v of VERTS){const diag=v.s.join("");if(v.s.some(s=>active.has(s))||active.has(diag))continue;o+=pin(v.a,0,2.5,false);}return o;}
const v1b=dirs=>{let o="";for(const d of dirs)o+=lead(ANG[d])+bond(ANG[d])+stubs(ANG[d]);return o+body(new Set(dirs))+core();};
const D2=(diags,orth=[])=>{let o="";for(const d of orth)o+=lead(ANG[d])+bond(ANG[d])+stubs(ANG[d]);for(const d of diags)o+=`<g ${rot(ANG[d])}><line x1="20" y1="14" x2="20" y2="6" stroke="${E}" stroke-width="2.4"/><circle cx="20" cy="5" r="2.6" fill="${E}"/><circle cx="20" cy="5" r="1.3" fill="#fff"/></g>`;return o+body(new Set([...orth,...diags]))+core();};
const A3=()=>`${[0,90,180,270].map(a=>`<g ${rot(a)} fill="none" stroke="${E}" stroke-width="2" stroke-linecap="round"><path d="M12 8 Q20 3 28 8"/></g>`).join("")}${[0,90,180,270].map(a=>`<g ${rot(a)} fill="none" stroke="${W}" stroke-width="1.2" stroke-linecap="round"><path d="M14.5 12 Q20 9 25.5 12"/></g>`).join("")}${[0,90,180,270].map(a=>`<g ${rot(a)}><circle cx="20" cy="3.5" r="1.6" fill="#fff"/></g>`).join("")}${core()}`;
const M4=()=>body(new Set())+core("#cfd8e0","#4d565f").replace('<circle cx="20" cy="20" r="3" fill="#fff"/>','<path d="M20 14 L25 16.5 V21 Q25 25 20 27 Q15 25 15 21 V16.5 Z" fill="#4d565f"/><path d="M20 16 L23.5 17.8 V21 Q23.5 23.6 20 25 V16 Z" fill="#fff" opacity=".85"/>');
const svg=inner=>`<svg viewBox="0 0 40 40" aria-hidden="true">${inner}</svg>`;

const defs=`<defs>
 <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#97c27c"/><stop offset=".7" stop-color="#7fae66"/><stop offset="1" stop-color="#5f8b4a"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="rgba(255,255,255,.07)"/></pattern>
 <pattern id="grid2" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0 H0 V12" fill="none" stroke="rgba(0,0,0,.05)"/></pattern>
 <radialGradient id="sheen" cx=".5" cy=".12" r=".5"><stop offset="0" stop-color="rgba(255,255,255,.18)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient>
 <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.28)"/></radialGradient>
</defs>`;
const base=`<rect width="390" height="844" fill="url(#mask)"/><rect width="390" height="844" fill="url(#grid)"/><rect width="390" height="844" fill="url(#sheen)"/>`;
const holes=[[22,22],[368,22],[22,822],[368,822]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#c9a648" opacity=".7"/><circle cx="${x}" cy="${y}" r="5" fill="#2a3a24"/>`).join("");
const silk=`<g font-family="Share Tech Mono, monospace" font-size="9" fill="rgba(255,255,255,.55)" letter-spacing="1.5"><text x="44" y="30">BLOODHOUND STUDIOS</text><text x="290" y="835">GI-06 REV B</text><text x="44" y="835">© 2026</text></g>`;

// tone-on-tone traces, margins only, darker green, no gold
const tt=["12,140 12,300 26,314 26,700","378,140 378,240 364,254 364,720","60,808 150,808 164,822 240,822","230,20 300,20 314,34 350,34"];
const tone=tt.map(p=>`<polyline points="${p}" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${p}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -1.5)"/>`).join("")
 +[[12,140],[26,700],[378,140],[364,720],[60,808],[240,822],[230,20],[350,34]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="rgba(0,0,0,.18)"/><circle cx="${x}" cy="${y}" r="1.6" fill="rgba(255,255,255,.35)"/>`).join("");

// copper only: scattered vias and one SMD pad pair in the margins
const viaPts=[[18,140],[18,420],[18,700],[372,160],[372,470],[372,720],[110,812],[280,812],[120,32],[270,32]];
const copper=viaPts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#c9a648" opacity=".55"/><circle cx="${x}" cy="${y}" r="2.2" fill="#3b4a33"/>`).join("")
 +`<g fill="#c9a648" opacity=".5"><rect x="40" y="800" width="14" height="8" rx="1"/><rect x="60" y="800" width="14" height="8" rx="1"/><rect x="316" y="796" width="8" height="14" rx="1"/><rect x="336" y="796" width="8" height="14" rx="1"/></g>`;

const variants=[
 {t:"B5. Tone-on-tone traces + fine grid + vignette",n:"B2's embossed margin traces on B4's 12px sub-grid, with the edge vignette. Sheen kept but pulled up so it doesn't fight the vignette.",bg:base+`<rect width="390" height="844" fill="url(#grid2)"/>`+tone+holes+silk+`<rect width="390" height="844" fill="url(#vig)"/>`},
];

const grid=["....." ,"....G" ,"P...P" ,"Pxx.P" ,"PS..." ,"Ph..." ,"Px..." ,"BPPP." ,"P...." ,".Q..." ,"....." ];
const map={".":"out","P":"chip2","B":"inf","G":"inf","Q":"inf","x":"trace","S":"shield","h":"half"};
const glyphFor={B:v1b(ORTH),G:D2(["SW"]),Q:A3()};
let cells="";
for(const line of grid)for(const ch of line){const cls=map[ch]||"out";let inner=cls==="chip2"?'<span class="dot"></span>':"";if(glyphFor[ch])inner=svg(glyphFor[ch]);if(cls==="shield")inner=svg(M4());cells+=`<div class="c ${cls}">${inner}</div>`;}
const tray=`<div class="slot next">${svg(v1b(["N","E","W"]))}<span class="lbl">NEXT</span></div><div class="slot q">${svg(v1b(["N"]))}</div><div class="slot q">${svg(D2(["NE","SW"]))}</div>`;

document.getElementById("row").innerHTML=variants.map(v=>`
<div class="col"><h3>${v.t}</h3><p class="n">${v.n}</p>
 <div class="screen">
  <svg class="bg" viewBox="0 0 390 844">${defs}${v.bg}</svg>
  <div class="hud"><span class="chip">MENU</span><div class="lvl"><small>GI-REV B</small>LEVEL 6</div><span class="chip">RESET</span></div>
  <span class="badge">LOCK 00</span>
  <div class="board">${cells}</div>
  <div class="tray">${tray}</div>
 </div></div>`).join("");
</script>
</body>
</html>
